<!doctype html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" id="taskly-theme-color" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" id="taskly-apple-status" />
  <meta name="apple-mobile-web-app-title" content="TASKLY" />
  <meta name="description"
    content="TASKLY: Productivity workspace with Kanban Board, Sprint Management, Focus Mode, Calendar, and Analytics." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
  <title>TASKLY | Productivity &amp; Workflow Workspace</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('taskly_theme');
        var active = saved === 'light' || saved === 'monochrome' ? saved : 'light';
        document.documentElement.setAttribute('data-theme', active);
        var metaColor = document.getElementById('taskly-theme-color');
        var metaApple = document.getElementById('taskly-apple-status');
        if (metaColor) metaColor.setAttribute('content', active === 'monochrome' ? '#0b0b0b' : '#ffffff');
        if (metaApple) metaApple.setAttribute('content', active === 'monochrome' ? 'black-translucent' : 'default');
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
